description: riskmethods was a supply-chain risk management SaaS company (Munich, Germany) that helped
  enterprises monitor, assess, and mitigate risk across their supplier networks using AI-driven risk
  intelligence, supplier monitoring, and disruption alerting. Backed by Point Nine Capital, riskmethods
  was acquired by Sphera in 2022 and its product now lives inside Sphera's Supply Chain Risk Management
  suite; the former riskmethods.net domain 301-redirects to sphera.com. riskmethods did not publish a
  public developer portal, OpenAPI definition, SDKs, or discovery endpoints, so this profile carries the
  identity and a probed domain-security posture rather than an API surface.
